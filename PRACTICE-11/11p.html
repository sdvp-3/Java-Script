      function playGame(playerMove) {
        const computerMove = pickComputerMove();
        let result = "";

        if (playerMove === "Heads") {
          if (computerMove === "Heads") {
            result = "win";
          } else {
            result = "Lose";
          }
        } else if (playerMove === "Tails") {
          if (computerMove === "Tails") {
            result = "win";
          } else {
            result = "Lose";
          }
        }

        document.getElementById("js-show-number").innerHTML = result;

        return result;
      }

      function pickComputerMove() {
        let computerMove = "";
        const randomNumber = Math.random();
        if (randomNumber >= 0 && randomNumber <= 1 / 2) {
          computerMove = "Heads";
        } else if (randomNumber >= 1 / 2 && randomNumber < 1) {
          computerMove = "Tails";
        }

        document.getElementById("js-generate").innerHTML =
          `${randomNumber.toFixed(2)}`;
        return computerMove;
      }
