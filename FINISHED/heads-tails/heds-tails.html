<!doctype html>
<html>
  <head>
    <title>flip coin games</title>
    <link rel="stylesheet" href="head-tail.css" />
  </head>
  <body>
    <p class="about">Coin flip Games</p>
    <div class="container">
      <div class="incontainer">
        <button class="img1b" onclick="playGame('Heads')">
          <img class="img1" src="img/head.png" />
        </button>
        <button class="img2b" onclick="playGame('Tails')">
          <img class="img2" src="img/tail.png" />
        </button>
      </div>

      <p class="js-result"></p>
      <p class="result"></p>
      <p class="js-show"></p>
      <button class="buttons" onclick="resetScore()">&#9851;</button>
    </div>

    <div class="container2">
      <div class="coin" id="coin">H</div>

      <button class="button2" onclick="flipCoin()">Flip Coin</button>
    </div>

    <script src="head-tail.js"></script>
  </body>
</html>
