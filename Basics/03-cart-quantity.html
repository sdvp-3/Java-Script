<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <p>Cart Quantity</p>

    <button onclick="
      let cartQuantity = 0;
      console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      Show Quantity
    </button>
    <button onclick="
      cartQuantity = cartQuantity + 1;
      console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      Add to cart
    </button>
    <button onclick="
      cartQuantity = cartQuantity + 2;
      console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      +2
    </button>
    <button onclick="
      cartQuantity = cartQuantity + 3;
      console.log(`Cart Quantity: ${cartQuantity}`);
    ">
      +3
    </button>
    <button onclick="
      cartQuantity = 0;
      console.log(`Cart was restarted now: ${cartQuantity}`);
    ">
      Restart
    </button>
  </body>
</html>

   <script>

    let cartQuantity= 0;

   </script>

  </body>

</html>
